name: Build artifacts

# GitHub-hosted public runners only (ubuntu-latest). No self-hosted runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warble-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    name: edition ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage xorriso make || true

      - name: Make and bake
        env:
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
          MOCK_ONLY: "0"
        run: |
          chmod +x scripts/make-and-bake.sh make-and-bake.sh
          make bake EDITION="${{ matrix.edition }}"
          ls -la out/
          find out -type f -size 0 -print -exec false {} + || {
            echo "Empty files in out/ — aborting"
            find out -type f -exec ls -la {} \;
            exit 1
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warble-linux-edition-${{ matrix.edition }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: prerelease (main)
    needs: bake
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all edition artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: warble-linux-edition-*
          merge-multiple: true

      - name: Guard non-empty assets
        run: |
          find release-assets -type f | sort
          find release-assets -type f -size 0 -print -exec false {} +

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}-${{ github.sha }}
          name: "Nightly build #${{ github.run_number }}"
          body: |
            Automated Warble Linux artifact build on **GitHub-hosted `ubuntu-latest`**.

            - Editions: **1–4** (minimal, developer, cloud-native, full)
            - Commit: `${{ github.sha }}`
            - Runner: public GitHub Actions (no self-hosted)
            - Note: Without complete archiso bootloaders / `mkarchiso`, ISO packages are **mock** (see MANIFEST assets).

            Rebuild locally: `make all-editions`
          files: release-assets/*
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
