name: Build & nightly

# GitHub-hosted public runners only (ubuntu-latest). No self-hosted runners.
# Nightly prereleases use semver: vX.Y.Z-nightly.N (from VERSION file).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warble-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      nightly_tag: ${{ steps.v.outputs.nightly_tag }}
      artifact_version: ${{ steps.v.outputs.artifact_version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          chmod +x scripts/version.sh
          SEMVER=$(./scripts/version.sh print | tr -d '\n')
          NIGHTLY_TAG=$(./scripts/version.sh nightly "${{ github.run_number }}")
          # Filename-safe: 0.2.0-nightly.12 (no leading v)
          ARTIFACT_VERSION="${SEMVER}-nightly.${{ github.run_number }}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER nightly_tag=$NIGHTLY_TAG artifact=$ARTIFACT_VERSION"

  bake:
    name: edition ${{ matrix.edition }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage xorriso make || true

      - name: Make and bake
        env:
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ needs.version.outputs.artifact_version }}
          GIT_SHA: ${{ github.sha }}
          MOCK_ONLY: "0"
        run: |
          chmod +x scripts/*.sh make-and-bake.sh
          make bake EDITION="${{ matrix.edition }}"
          ls -la out/
          find out -type f -size 0 -print -exec false {} + || {
            echo "Empty files in out/ — aborting"
            find out -type f -exec ls -la {} \;
            exit 1
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warble-linux-edition-${{ matrix.edition }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  test-matrix:
    name: test all artifacts
    needs: [version, bake]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all edition artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: warble-linux-edition-*
          merge-multiple: true

      - name: Run artifact tests
        run: |
          chmod +x scripts/test-artifacts.sh
          ls -la out/
          OUT_DIR="$PWD/out" ./scripts/test-artifacts.sh

  nightly:
    name: semver nightly prerelease
    needs: [version, bake, test-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all edition artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: warble-linux-edition-*
          merge-multiple: true

      - name: Guard non-empty assets
        run: |
          find release-assets -type f | sort
          find release-assets -type f -size 0 -print -exec false {} +

      - name: Create semver prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.nightly_tag }}
          name: "v${{ needs.version.outputs.semver }} nightly #${{ github.run_number }}"
          body: |
            ## Warble Linux `${{ needs.version.outputs.nightly_tag }}`

            Automated **prerelease** from `main` (semver base **${{ needs.version.outputs.semver }}**).

            | | |
            |--|--|
            | **Tag** | `${{ needs.version.outputs.nightly_tag }}` |
            | **Artifact version** | `${{ needs.version.outputs.artifact_version }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Editions** | 1 minimal · 2 developer · 3 cloud-native · 4 full |
            | **Runner** | GitHub-hosted `ubuntu-latest` |

            Assets: ISO · WSL tarball · OVF · Vagrant `.box` · MANIFEST · SHA256SUMS.

            > Public runners have no `mkarchiso`. Check `mock=` in each MANIFEST.
            > Stable releases: push a `vX.Y.Z` tag or run **Release** workflow.

            ```bash
            make release-check
            ```
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
