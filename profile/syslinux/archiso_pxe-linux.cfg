LABEL arch_nbd
TEXT HELP
Boot the Warble Linux live sandbox using NBD.
Ephemeral sandbox for testing, learning, and cloud-native workflows.
ENDTEXT
MENU LABEL Warble Linux live sandbox (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

